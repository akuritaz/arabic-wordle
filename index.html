<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ووردل عربي</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#121213;color:#fff;font-family:Tahoma,Arial;display:flex;justify-content:center}.game{width:min(96%,540px);text-align:center;padding:16px 8px}h1{margin:4px}.sub{color:#aaa}#msg{min-height:30px;margin:8px;font-weight:bold}#board,#kb{display:flex;flex-direction:column;gap:6px;align-items:center}#board{margin:10px auto 24px}.row{display:flex;gap:6px}.tile{width:58px;height:58px;border:2px solid #3a3a3c;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:bold}.key{height:50px;min-width:36px;border:0;border-radius:5px;background:#818384;color:#fff;font:700 18px Tahoma;padding:0 7px}.wide{min-width:67px;font-size:13px}.correct{background:#538d4e!important;border-color:#538d4e!important}.present{background:#b59f3b!important;border-color:#b59f3b!important}.absent{background:#3a3a3c!important;border-color:#3a3a3c!important}.filled{border-color:#565758}#share{display:none;margin:18px auto;padding:11px 20px;border:0;border-radius:6px;background:#538d4e;color:#fff;font-weight:bold}@media(max-width:430px){.tile{width:50px;height:50px}.key{min-width:29px;padding:0 5px;font-size:16px}}</style></head>
<body><main class="game"><h1>ووردل عربي</h1><div class="sub">خمن كلمة اليوم في 6 محاولات</div><div id="msg"></div><div id="board"></div><div id="kb"></div><button id="share">مشاركة النتيجة 📋</button></main>
<script>
const N=5,MAX=6;
const answers=["مكتبة","حديقة","سيارة","مدينة","سفينة","طاولة","نافذة","مفتاح","جريدة","كراسة","وسادة","حقيبة","ستارة","مزرعة","جزيرة","مدرسة","ميدان","رسالة","صناعة","تجارة","زيارة","عبارة","اشارة","عمارة","سعادة","كرامة","ثقافة","رياضة","صحافة","زراعة","مائدة","خزانة","منارة","سحابة","حمامة","فراشة"].filter(x=>[...x].length===5);
const allowed=new Set([...answers,"جميلة","سريعة","بعيدة","قريبة","غريبة","قديمة","جديدة","خفيفة","باردة","ساخنة","كريمة","سعيدة","حزينة","نظيفة","مريضة","شهيرة","كثيرة","قليلة","دقيقة","كبيرة"].filter(x=>[...x].length===5));
const norm=s=>s.trim().replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[\u064B-\u065F\u0670]/g,"");
const day=Math.floor(Date.UTC(new Date().getUTCFullYear(),new Date().getUTCMonth(),new Date().getUTCDate())/86400000), answer=answers[day%answers.length], A=norm(answer), key="arabic-wordle-v3-"+day;
let cur="",guesses=[],results=[],over=false;const board=document.querySelector("#board"),kb=document.querySelector("#kb"),msg=document.querySelector("#msg"),share=document.querySelector("#share"),buttons={};
for(let r=0;r<MAX;r++){let row=document.createElement("div");row.className="row";for(let c=0;c<N;c++){let t=document.createElement("div");t.className="tile";t.id=`t-${r}-${c}`;row.append(t)}board.append(row)}
const rows=[["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د"],["ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط"],["⌫","ئ","ء","ؤ","ر","ى","ة","و","ز","ظ","إدخال"]];
rows.forEach(a=>{let row=document.createElement("div");row.className="row";a.forEach(k=>{let b=document.createElement("button");b.className="key"+((k==="⌫"||k==="إدخال")?" wide":"");b.textContent=k;b.onclick=()=>press(k);row.append(b);if(!["⌫","إدخال"].includes(k))buttons[k]=b});kb.append(row)});
function press(k){if(over)return;if(k==="⌫"){cur=[...cur].slice(0,-1).join("");draw();return}if(k==="إدخال"){submit();return}if([...cur].length<N){cur+=k;draw()}}
function draw(){let r=guesses.length,a=[...cur];for(let c=0;c<N;c++){let t=document.querySelector(`#t-${r}-${c}`),x=a[c]||"";t.textContent=x;t.classList.toggle("filled",!!x)}}
function evalGuess(g){let a=[...A],q=[...norm(g)],out=Array(N).fill("absent");for(let i=0;i<N;i++)if(q[i]===a[i]){out[i]="correct";q[i]=a[i]=null}for(let i=0;i<N;i++){if(q[i]===null)continue;let j=a.indexOf(q[i]);if(j>=0){out[i]="present";a[j]=null}}return out}
const p={absent:1,present:2,correct:3};function keyColor(l,s){[l,norm(l)].forEach(x=>{let b=buttons[x];if(!b)return;let old=b.dataset.s;if(!old||p[s]>p[old]){if(old)b.classList.remove(old);b.classList.add(s);b.dataset.s=s}})}
function paint(r,g,res){[...g].forEach((l,i)=>{let t=document.querySelector(`#t-${r}-${i}`);t.textContent=l;t.classList.add(res[i]);keyColor(l,res[i])})}
function accepted(g){let n=norm(g);return [...allowed].some(w=>norm(w)===n)}
function say(x){msg.textContent=x;if(!over){clearTimeout(say.t);say.t=setTimeout(()=>msg.textContent="",1800)}}
function submit(){if([...cur].length!==N)return say("الكلمة لازم تكون 5 أحرف");if(!accepted(cur))return say("الكلمة غير موجودة في القائمة");let g=cur,res=evalGuess(g),r=guesses.length;guesses.push(g);results.push(res);paint(r,g,res);cur="";if(norm(g)===A){over=true;say("صح عليك! 🎉");share.style.display="block"}else if(guesses.length>=MAX){over=true;say("انتهت المحاولات 😭 الكلمة: "+answer);share.style.display="block"}save()}
function save(){localStorage.setItem(key,JSON.stringify({guesses,results,over}))}function load(){let raw=localStorage.getItem(key);if(!raw)return;try{let d=JSON.parse(raw);guesses=d.guesses||[];results=d.results||[];over=!!d.over;guesses.forEach((g,r)=>paint(r,g,results[r]||evalGuess(g)));if(over){say(guesses.some(g=>norm(g)===A)?"خلصتها اليوم 🎉":"كلمة اليوم كانت: "+answer);share.style.display="block"}}catch{localStorage.removeItem(key)}}
document.addEventListener("keydown",e=>{if(e.key==="Backspace")press("⌫");else if(e.key==="Enter")press("إدخال");else if(/^[\u0621-\u064A]$/.test(e.key))press(e.key)});
share.onclick=async()=>{let squares=results.map(r=>r.map(s=>s==="correct"?"🟩":s==="present"?"🟨":"⬛").join("")).join("\n"),won=guesses.some(g=>norm(g)===A),text=`ووردل عربي ${won?guesses.length:"X"}/${MAX}\n\n${squares}`;try{await navigator.clipboard.writeText(text);say("تم نسخ النتيجة 📋")}catch{say("ما قدرت أنسخ النتيجة")}};load();
</script></body></html>
